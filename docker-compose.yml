services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tiktok_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
volumes:
  postgres_data:
